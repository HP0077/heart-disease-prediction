<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAFEHEARTAI</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffcccc, #ff9999);
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
            position: relative;
        }
        .header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo {
            width: 300px;
            height: auto;
        }
        .title {
            font-size: 40px;
            font-weight: 700;
            color: #b30000;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .info-section {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            font-size: 20px;
            line-height: 1.8;
            width: 80%;
            max-width: 900px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            margin-top: 80px;
        }
        .info-section:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }
        .start-button {
            background-color: #b30000;
            color: white;
            padding: 18px 50px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 700;
            transition: all 0.4s ease;
            display: inline-block;
            text-decoration: none;
            margin-top: 30px;
            animation: pulse 2s infinite;
        }
        .start-button:hover {
            background-color: #990000;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .footer {
            margin-top: 40px;
            color: #888;
            font-size: 14px;
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="SAFEHEARTAI Logo" class="logo">
        <div class="title">SafeHeartAI</div>
    </div>
    <div class="info-section">
        <p>Welcome to SafeHeartAI - your trusted companion in heart health assessment. Click below to get started.</p>
    </div>
    <a href="{{ url_for('predict_page') }}" class="start-button">Get Started</a>
    <div class="footer">
        <p>&copy; 2024 SafeHeartAI. All Rights Reserved.</p>
    </div>
</body>
</html>
